name: Build and Release Addon

on:
  push:
    tags: ["*"]
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zip gettext

    - name: Build addon
      run: |
        chmod +x build_linux.sh
        ./build_linux.sh

    - name: Upload packaged addon artifact
      uses: actions/upload-artifact@v4
      with:
        name: packaged_addon
        path: ./*.nvda-addon

  release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: ["build"]
    permissions:
      contents: write
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Download packaged addon
      uses: actions/download-artifact@v4
      with:
        name: packaged_addon
        path: .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./*.nvda-addon
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref, '-') }}
